name: isolated-encrypted-signer
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      payment_environment:
        description: Must match the separately configured custody and database namespace
        required: true
        default: testnet
        type: choice
        options:
          - testnet
          - mainnet
permissions:
  contents: read
jobs:
  sign:
    if: vars.ENABLE_SIGNER_WORKER == 'true' && github.repository == 'nero1/onyiy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ (inputs.payment_environment || vars.SIGNER_PAYMENT_ENVIRONMENT || 'testnet') == 'mainnet' && 'signer-mainnet' || 'signer-testnet' }}
    timeout-minutes: 6
    concurrency:
      group: isolated-signer-${{ inputs.payment_environment || vars.SIGNER_PAYMENT_ENVIRONMENT || 'testnet' }}
      cancel-in-progress: false
    env:
      APP_ENV: ${{ inputs.payment_environment || vars.SIGNER_PAYMENT_ENVIRONMENT || 'testnet' }}
      MAINNET_ENABLED: ${{ (inputs.payment_environment || vars.SIGNER_PAYMENT_ENVIRONMENT || 'testnet') == 'mainnet' && 'true' || 'false' }}
      SIGNER_PROVIDER: encrypted_worker
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate and install encrypted files without database or RPC credentials
        env:
          SIGNER_KEY_PACKAGE_JSON: ${{ secrets.SIGNER_KEY_PACKAGE_JSON }}
          SIGNER_DECRYPTION_SECRET: ${{ secrets.SIGNER_DECRYPTION_SECRET }}
        run: node --import tsx workers/signer/install-key-package.ts "$RUNNER_TEMP/signer-keys"
      - name: Observe retained attempts and run one bounded signing pass
        env:
          NODE_ENV: production
          SIGNER_DECRYPTION_SECRET: ${{ secrets.SIGNER_DECRYPTION_SECRET }}
          SIGNER_DATABASE_URL: ${{ secrets.SIGNER_DATABASE_URL }}
          SIGNED_PAYLOAD_ENCRYPTION_KEY: ${{ secrets.SIGNED_PAYLOAD_ENCRYPTION_KEY }}
          FINANCIAL_WORKER_AUTH_KEY: ${{ secrets.FINANCIAL_WORKER_AUTH_KEY }}
          ALERT_WEBHOOK_KEY: ${{ secrets.ALERT_WEBHOOK_KEY }}
          ALERT_WEBHOOK_URL: ${{ vars.ALERT_WEBHOOK_URL }}
          FINANCIAL_API_ORIGIN: ${{ vars.FINANCIAL_API_ORIGIN }}
          DATABASE_TLS_CA_PEM: ${{ vars.DATABASE_TLS_CA_PEM }}
          PRICE_PROVIDER: ${{ vars.PRICE_PROVIDER || 'coinmarketcap' }}
          COINMARKETCAP_IDS_JSON: ${{ vars.COINMARKETCAP_IDS_JSON }}
          PRICE_FEED_PUBLIC_KEY: ${{ vars.PRICE_FEED_PUBLIC_KEY }}
          ASSET_REGISTRY_JSON: ${{ vars.ASSET_REGISTRY_JSON }}
          OUTBOUND_ALLOWED_HOSTS: ${{ vars.OUTBOUND_ALLOWED_HOSTS }}
          FINANCIAL_ACTIVATION: ${{ vars.FINANCIAL_ACTIVATION }}
          FINANCIAL_CONFIG_APPROVALS_JSON: ${{ vars.FINANCIAL_CONFIG_APPROVALS_JSON }}
          ALERT_ACCEPTANCE_FINGERPRINTS_JSON: ${{ vars.ALERT_ACCEPTANCE_FINGERPRINTS_JSON }}
          SIGNER_HARD_PER_TX_USD: ${{ vars.SIGNER_HARD_PER_TX_USD || '5000' }}
          SIGNER_HARD_DAILY_PER_ASSET_USD: ${{ vars.SIGNER_HARD_DAILY_PER_ASSET_USD || '10000' }}
          SIGNER_HARD_AUTO_APPROVE_USD: ${{ vars.SIGNER_HARD_AUTO_APPROVE_USD || '100' }}
          RPC_PRIMARY_ETH_TESTNET: ${{ vars.RPC_PRIMARY_ETH_TESTNET }}
          RPC_SECONDARY_ETH_TESTNET: ${{ vars.RPC_SECONDARY_ETH_TESTNET }}
          RPC_PRIMARY_BNB_TESTNET: ${{ vars.RPC_PRIMARY_BNB_TESTNET }}
          RPC_SECONDARY_BNB_TESTNET: ${{ vars.RPC_SECONDARY_BNB_TESTNET }}
          RPC_PRIMARY_SOL_TESTNET: ${{ vars.RPC_PRIMARY_SOL_TESTNET }}
          RPC_SECONDARY_SOL_TESTNET: ${{ vars.RPC_SECONDARY_SOL_TESTNET }}
          RPC_PRIMARY_TRON_TESTNET: ${{ vars.RPC_PRIMARY_TRON_TESTNET }}
          RPC_SECONDARY_TRON_TESTNET: ${{ vars.RPC_SECONDARY_TRON_TESTNET }}
          RPC_PRIMARY_ETH_MAINNET: ${{ vars.RPC_PRIMARY_ETH_MAINNET }}
          RPC_SECONDARY_ETH_MAINNET: ${{ vars.RPC_SECONDARY_ETH_MAINNET }}
          RPC_PRIMARY_BNB_MAINNET: ${{ vars.RPC_PRIMARY_BNB_MAINNET }}
          RPC_SECONDARY_BNB_MAINNET: ${{ vars.RPC_SECONDARY_BNB_MAINNET }}
          RPC_PRIMARY_SOL_MAINNET: ${{ vars.RPC_PRIMARY_SOL_MAINNET }}
          RPC_SECONDARY_SOL_MAINNET: ${{ vars.RPC_SECONDARY_SOL_MAINNET }}
          RPC_PRIMARY_TRON_MAINNET: ${{ vars.RPC_PRIMARY_TRON_MAINNET }}
          RPC_SECONDARY_TRON_MAINNET: ${{ vars.RPC_SECONDARY_TRON_MAINNET }}
          PLATFORM_RECEIVING_ADDRESS_ETH_TESTNET: ${{ vars.PLATFORM_RECEIVING_ADDRESS_ETH_TESTNET }}
          PLATFORM_DEV_ADDRESS_ETH_TESTNET: ${{ vars.PLATFORM_DEV_ADDRESS_ETH_TESTNET }}
          PLATFORM_MARKETING_ADDRESS_ETH_TESTNET: ${{ vars.PLATFORM_MARKETING_ADDRESS_ETH_TESTNET }}
          PLATFORM_BOOTSTRAP_ADDRESS_ETH_TESTNET: ${{ vars.PLATFORM_BOOTSTRAP_ADDRESS_ETH_TESTNET }}
          PLATFORM_SWEEP_ADDRESS_ETH_TESTNET: ${{ vars.PLATFORM_SWEEP_ADDRESS_ETH_TESTNET }}
          PLATFORM_RECEIVING_ADDRESS_BNB_TESTNET: ${{ vars.PLATFORM_RECEIVING_ADDRESS_BNB_TESTNET }}
          PLATFORM_DEV_ADDRESS_BNB_TESTNET: ${{ vars.PLATFORM_DEV_ADDRESS_BNB_TESTNET }}
          PLATFORM_MARKETING_ADDRESS_BNB_TESTNET: ${{ vars.PLATFORM_MARKETING_ADDRESS_BNB_TESTNET }}
          PLATFORM_BOOTSTRAP_ADDRESS_BNB_TESTNET: ${{ vars.PLATFORM_BOOTSTRAP_ADDRESS_BNB_TESTNET }}
          PLATFORM_SWEEP_ADDRESS_BNB_TESTNET: ${{ vars.PLATFORM_SWEEP_ADDRESS_BNB_TESTNET }}
          PLATFORM_RECEIVING_ADDRESS_SOL_TESTNET: ${{ vars.PLATFORM_RECEIVING_ADDRESS_SOL_TESTNET }}
          PLATFORM_DEV_ADDRESS_SOL_TESTNET: ${{ vars.PLATFORM_DEV_ADDRESS_SOL_TESTNET }}
          PLATFORM_MARKETING_ADDRESS_SOL_TESTNET: ${{ vars.PLATFORM_MARKETING_ADDRESS_SOL_TESTNET }}
          PLATFORM_BOOTSTRAP_ADDRESS_SOL_TESTNET: ${{ vars.PLATFORM_BOOTSTRAP_ADDRESS_SOL_TESTNET }}
          PLATFORM_SWEEP_ADDRESS_SOL_TESTNET: ${{ vars.PLATFORM_SWEEP_ADDRESS_SOL_TESTNET }}
          PLATFORM_RECEIVING_ADDRESS_TRON_TESTNET: ${{ vars.PLATFORM_RECEIVING_ADDRESS_TRON_TESTNET }}
          PLATFORM_DEV_ADDRESS_TRON_TESTNET: ${{ vars.PLATFORM_DEV_ADDRESS_TRON_TESTNET }}
          PLATFORM_MARKETING_ADDRESS_TRON_TESTNET: ${{ vars.PLATFORM_MARKETING_ADDRESS_TRON_TESTNET }}
          PLATFORM_BOOTSTRAP_ADDRESS_TRON_TESTNET: ${{ vars.PLATFORM_BOOTSTRAP_ADDRESS_TRON_TESTNET }}
          PLATFORM_SWEEP_ADDRESS_TRON_TESTNET: ${{ vars.PLATFORM_SWEEP_ADDRESS_TRON_TESTNET }}
          PLATFORM_RECEIVING_ADDRESS_ETH_MAINNET: ${{ vars.PLATFORM_RECEIVING_ADDRESS_ETH_MAINNET }}
          PLATFORM_DEV_ADDRESS_ETH_MAINNET: ${{ vars.PLATFORM_DEV_ADDRESS_ETH_MAINNET }}
          PLATFORM_MARKETING_ADDRESS_ETH_MAINNET: ${{ vars.PLATFORM_MARKETING_ADDRESS_ETH_MAINNET }}
          PLATFORM_BOOTSTRAP_ADDRESS_ETH_MAINNET: ${{ vars.PLATFORM_BOOTSTRAP_ADDRESS_ETH_MAINNET }}
          PLATFORM_SWEEP_ADDRESS_ETH_MAINNET: ${{ vars.PLATFORM_SWEEP_ADDRESS_ETH_MAINNET }}
          PLATFORM_RECEIVING_ADDRESS_BNB_MAINNET: ${{ vars.PLATFORM_RECEIVING_ADDRESS_BNB_MAINNET }}
          PLATFORM_DEV_ADDRESS_BNB_MAINNET: ${{ vars.PLATFORM_DEV_ADDRESS_BNB_MAINNET }}
          PLATFORM_MARKETING_ADDRESS_BNB_MAINNET: ${{ vars.PLATFORM_MARKETING_ADDRESS_BNB_MAINNET }}
          PLATFORM_BOOTSTRAP_ADDRESS_BNB_MAINNET: ${{ vars.PLATFORM_BOOTSTRAP_ADDRESS_BNB_MAINNET }}
          PLATFORM_SWEEP_ADDRESS_BNB_MAINNET: ${{ vars.PLATFORM_SWEEP_ADDRESS_BNB_MAINNET }}
          PLATFORM_RECEIVING_ADDRESS_SOL_MAINNET: ${{ vars.PLATFORM_RECEIVING_ADDRESS_SOL_MAINNET }}
          PLATFORM_DEV_ADDRESS_SOL_MAINNET: ${{ vars.PLATFORM_DEV_ADDRESS_SOL_MAINNET }}
          PLATFORM_MARKETING_ADDRESS_SOL_MAINNET: ${{ vars.PLATFORM_MARKETING_ADDRESS_SOL_MAINNET }}
          PLATFORM_BOOTSTRAP_ADDRESS_SOL_MAINNET: ${{ vars.PLATFORM_BOOTSTRAP_ADDRESS_SOL_MAINNET }}
          PLATFORM_SWEEP_ADDRESS_SOL_MAINNET: ${{ vars.PLATFORM_SWEEP_ADDRESS_SOL_MAINNET }}
          PLATFORM_RECEIVING_ADDRESS_TRON_MAINNET: ${{ vars.PLATFORM_RECEIVING_ADDRESS_TRON_MAINNET }}
          PLATFORM_DEV_ADDRESS_TRON_MAINNET: ${{ vars.PLATFORM_DEV_ADDRESS_TRON_MAINNET }}
          PLATFORM_MARKETING_ADDRESS_TRON_MAINNET: ${{ vars.PLATFORM_MARKETING_ADDRESS_TRON_MAINNET }}
          PLATFORM_BOOTSTRAP_ADDRESS_TRON_MAINNET: ${{ vars.PLATFORM_BOOTSTRAP_ADDRESS_TRON_MAINNET }}
          PLATFORM_SWEEP_ADDRESS_TRON_MAINNET: ${{ vars.PLATFORM_SWEEP_ADDRESS_TRON_MAINNET }}
        run: node --import tsx workers/signer/run.ts --once
