name: ci-vercel

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:all
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run check:secrets

  deploy:
    needs: checks
    # Credential-free iterations run checks only. Enable explicitly once the
    # hosted projects and protected production/preview environments are ready.
    if: >-
      vars.ENABLE_VERCEL_DEPLOYMENTS == 'true' &&
      github.repository == 'nero1/onyiy' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview')
    runs-on: ubuntu-latest
    environment: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    concurrency:
      group: vercel-shared-hosted-database
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DEPLOYMENT_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check deployment bindings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SELECTED_PUBLIC_PREVIEW_MODE: ${{ vars.PUBLIC_PREVIEW_MODE || 'off' }}
          DATABASE_MIGRATION_URL: ${{ vars.PUBLIC_PREVIEW_MODE != 'read_only' && secrets.DATABASE_MIGRATION_URL || '' }}
        run: |
          required="VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID DATABASE_URL"
          if [ "$SELECTED_PUBLIC_PREVIEW_MODE" != read_only ]; then required="$required DATABASE_MIGRATION_URL"; fi
          for name in $required; do
            if [ -z "${!name}" ]; then echo "::error::Missing deployment binding: $name"; exit 1; fi
          done
      - name: Retrieve hosted configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ENV: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}
        run: |
          if [ "$VERCEL_ENV" = preview ]; then
            npx --no-install vercel pull --yes --environment=preview --git-branch="$DEPLOYMENT_GIT_BRANCH" --token="$VERCEL_TOKEN"
          else
            npx --no-install vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          fi
      - name: Validate hosted settings
        env:
          VERCEL_ENV: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}
          EXPECTED_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EXPECTED_PUBLIC_PREVIEW_MODE: ${{ vars.PUBLIC_PREVIEW_MODE || 'off' }}
        run: node --env-file=".vercel/.env.$VERCEL_ENV.local" --import tsx scripts/validate-deployment.ts --hosted
      - name: Verify read-only preview without owner credentials
        if: vars.PUBLIC_PREVIEW_MODE == 'read_only'
        env:
          VERCEL_ENV: preview
        run: node --env-file=".vercel/.env.preview.local" --import tsx scripts/verify-public-preview.ts
      - name: Verify manual schema and initialize the hosted environment without signing
        if: vars.PUBLIC_PREVIEW_MODE != 'read_only'
        env:
          # Owner tooling runs on GitHub, even if pulled settings contain VERCEL=1.
          # Keep the real Vercel runtime marker/owner-credential rejection intact.
          VERCEL: "0"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          DATABASE_TLS_CA_PEM: ${{ secrets.DATABASE_TLS_CA_PEM }}
          VERCEL_ENV: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}
        run: node --env-file=".vercel/.env.$VERCEL_ENV.local" --import tsx scripts/initialize-hosted.ts
      - name: Build and deploy prebuilt output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ENV: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}
        run: |
          if [ "$VERCEL_ENV" = production ]; then
            npx --no-install vercel build --prod --token="$VERCEL_TOKEN"
            npm run check:secrets
            npx --no-install vercel deploy --prebuilt --prod --meta githubDeployment=1 --meta "githubCommitRef=$DEPLOYMENT_GIT_BRANCH" --token="$VERCEL_TOKEN"
          else
            npx --no-install vercel build --token="$VERCEL_TOKEN"
            npm run check:secrets
            npx --no-install vercel deploy --prebuilt --meta githubDeployment=1 --meta "githubCommitRef=$DEPLOYMENT_GIT_BRANCH" --token="$VERCEL_TOKEN"
          fi
